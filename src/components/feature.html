        <td width="12" color="bordercolor" style="width:12px; background-color:{{bordercolor}}"></td>
        <td style="padding-left:12px; padding-right: 20px; padding-top:12px; padding-bottom:12px; margin:0; border:0">
            <div>
                <h2 class="m-0 font-main text-2xl">{{ heading }}</h2>
            </div>
        </td>
    </tr>
