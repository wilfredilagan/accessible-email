                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">

                            <component src="h2-top.html" text="Hilton teams are ‘sock stars’ at CSUN 2024"></component>
                            <component src="feature.html" 
                                image="../images/csun-group.jpeg"
                                alt="The Hilton team at CSUN 2024 with big smiles on">
                                <component src="p.html" text="On March 18–22, close to 40 Hilton team members – attended the California State University, Northridge (CSUN) assistive technology conference in Anaheim, California. The CSUN conference is the premier technology forum for people with disabilities. Zane McHattie, Adam Page, and Nicole Bergstrom delivered an engaging presentation, Beyond Silos:  Hilton’s Cross-functional Accessibility Model, drawing a crowd of over 50 people and asserting Hilton’s maturity in digital accessibility delivery."></component>
                                <component src="img.html" image="../images/csun-presentation.png" alt="Adam, Zane and Nicole sitting at table for their Beyond Silos: Hilton's Cross-Functional Accessibility Model presentation"></component>
                                <component src="p.html" text="If conference attendance wasn’t enough.  On March 21, the Hilton conference attendees partnered with the Hilton Anaheim to celebrate World Down Syndrome Day with the Lots of Socks campaign.  Everyone wore mismatched socks, signifying the unique trisomy of the 21st chromosome that’s responsible for Down syndrome.  The hotel set up a “Lots of Socks” booth in the lobby staffed by Abilities TMRG members and invited guests to design a sock for the day."></component>
                                <component src="img.html" image="../images/csun-lotsofsocks.png" alt="Nicole, Meredith, LaTonya, and Jill holding down the WDS table at the Anaheim."></component>
                                <component src="p.html" text="CSUN along with the Hilton Anaheim’s engagement is a highly immersive experience.  Hilton attendees leave with broader understanding of the disability community and become strong A11y champions.  Here’s what attendees had to say about the conference:"></component>
                                <component src="p.html" text="“CSUN was an amazing conference to attend, for many reasons. The excitement and passion around accessibility was palpable, and it was clear that everyone there had a genuine interest in making the world a better place—for everyone. Meeting in person with the leading experts in assistive technology was an invaluable experience, and I left with an even deeper appreciation for the accessibility advocates we work with here at Hilton.” – <strong>Regan Rusnak, Product Manager, Brand Pod</strong>"></component>
                                <component src="p.html" text="“This year I was fortunate to have my second opportunity to join the Hilton team in Anaheim and attend the CSUN Assistive Technology Conference. Each year I attend this conference I learn more and more about our users that engage with Hilton products through the usage of assistive technologies, and this experience always serves to reset the importance of focusing on accessibility in our products.” – <strong>Carter Capocaccia, Senior Manager, Quality Engineering</strong>"></component>
                                <component src="p.html" text="“I learned that I’ve been unintentionally ableist when I thought I was being an ally. I left CSUN with more tools in my toolbox and a deeper level of empathy that will make me more effective on the ATRMG leadership team as well as in the recruiting space. The other significant takeaway for me was getting to know the other Hilton TMs that attended and the incredible amount of work Hilton is doing in the accessibility space!” – <strong>Meredith Moore, Senior Manager, Early Talent, Hotel Operations</strong>"></component>
                                <component src="p.html" text="That’s all for CSUN 2024 but keep an eye out for registration to CSUN 2025.   The accessibility team will provide details on how to register closer to the date."></component>
                                <component src="p.html" text="<a href='https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/CSUN-Gallery.aspx' style='text-decoration:underline'>CSUN 2024 Gallery</a>"></component>
                            </component>
                        <component src="two-column-bullet-heading.html" 
                            image2="../images/GAAD.png"
                            alt2="GAAD logo"
                            heading2="Sign up for GAAD 2024"
                            text3='Join us on another exciting journey of inclusion May 14–16 as we celebrate GAAD around the world, inspired by this year’s theme: ‘Make it Right, Make it Accessible.’ Immerse in a range of activities tailored to champion accessibility in the Dallas, Memphis, McLean, Glasgow, Dubai, and Watford offices. Can’t join us in person? Sign up for engaging online sessions including our keynote speaker Joe Devon, the co-founder and chair of the GAAD Foundation. Brought to you by the Hilton Digital Accessibility team with support from the Abilities TMRG, and a village of volunteers. <p>Visit the <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/GAAD-2024.aspx" style="text-decoration:underline">GAAD SharePoint site</a> to sign up for events and learn more'
                            image1="../images/alt-text.png"
                            heading1="Contest: The Power of Alt Text"
                            alt1="A dog sitting on an luggage with other luggage coming out of the back of a van"
                            >
                            <component src="p.html" text="Images have a story to tell, and alternative text (alt) is here so screen readers can be the voice for them. The alt also serves as a backup when the image cannot be displayed or fails to load."></component>
                            <component src="p.html" text="If a picture is worth a thousand words, how do we sum it up in only a few? First, consider the context: is the image decorative, informative, or illustrative of a feeling or emotion? Tailor the alt text accordingly. Be descriptive, not literal. Avoid bland descriptions and opt for descriptive yet concise text."></component>
                            <component src="p.html" text="Some platforms automatically generate alt text using AI. While this can be a helpful starting point, it’s essential to review and refine the text to be consistent with Hilton's established tone and voice for public-facing content."></component>
                            <component src="p.html" text='Imagine the photo in this article is being used to advertise our pet-friendly properties. What would you write for the alt text? Get creative and let us know in our <a href="https://engage.cloud.microsoft/main/org/hilton.com/threads/eyJfdHlwZSI6IlRocmVhZCIsImlkIjoiMjc1NTQ2MDk2MzM3NzE1MiJ9?trk_copy_link=V2" style="text-decoration:underline">Viva Engage post</a> and you could win a Starbucks gift card!'></component>
                        </component>
                        <component src="two-column-bullet-heading.html"
                            image1="../images/april-8-eclipse.jpg"
                            alt1="Total Solar Eclipse 2024"
                            heading1="An accessible solar eclipse"
                            text1='Millions of people across America traveled to witness the solar eclipse on April 8. It was a great day for our Hilton hotels within the path of totality as many were sold out with people gathering to experience the astronomical spectacle. There were many warnings to not stare directly at the sun without proper eye protection, but did you ever wonder what it was like for people who cannot see? There was plenty of other sensory anomalies to experience during the eclipse: cooling temperatures, the sounds of nighttime insects and, thanks to innovative technologies, the ability to ‘touch the sun.’ Tactile and audible learning experiences are made available thanks to organizations such as <a href="https://sservi.nasa.gov/books/eclipses.html" style="text-decoration:underline">NASA</a>, <a href="https://astrolab.fas.harvard.edu/LightSound.html" style="text-decoration:underline">The LightSound Project</a>, <a href="https://www.youtube.com/watch?v=lfH3gSpcHlw" style="text-decoration:underline">American Printing House (APH)</a>, and <a href="https://www.perkins.org/resource/watching-solar-eclipse-low-vision/" style="text-decoration:underline">Perkins School for the Blind.</a>'
                            image2="../images/design-system.png"
                            alt2="The universal symbol for accessibility next to a color pallate and text"
                            heading2="Design system accessibility"
                            text3="Design systems are very important when thinking about accessibility.  Accessibility can be baked into every part of a design system by making sure that every design component and code element is aligned to accessibility standards at the beginning of process.  One thing that can be lost when thinking about design systems is thinking that using the design system will solve all accessibility issues.  This is not always the case.
                            <p>Color contrast must be taking into account when using components.  A design system colors may take into account accessibility, but it’s the use of the colors with respect to each other that should be considered.</p>
                            <p>When using accessible components, the interactions between each component should be considered.  A component might be accessible on its own, but when put into the scope of an page or screen, it’s the interactions between the components that should be looked at as well.</p>
                            "
                        ></component>
