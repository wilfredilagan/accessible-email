                        <component src="h2-top.html" text="Unlocking accessibility access"></component>
                        <component src="feature.html" 
                            image="../images/unlock_accessibilty.png"
                            alt="The Hilton team at CSUN 2024 with big smiles on">
                            <component src="p.html" text='Welcome to the Hospitable Hilton newsletter, provided to you by the Accessibility Center of Excellence. We’re here to raise awareness about accessibility by celebrating the excellent work taking place at Hilton to make travel inclusive for our guests and team members with and without disabilities.<h3 class="font-main">Disability Stats</h3><p class="text-sm font-main leading-4.5 m-0">Did you know the number of people worldwide who have a significant disability is roughly 1.3 billion? That is almost the entire population of China! People with Disabilities (PwD) often travel with companions, so when you include the friends, family, employers, and caregivers of PwD, it adds 2 billion more people with an estimated total spending power of $16 trillion. The need for accessibility can’t be underestimated.</p><h3 class="font-main">How you can contribute</h3><p class="text-sm font-main leading-4.5 m-0">Get involved in Hilton’s best-in-class accessible travel experiences and increase your accessibility knowledge:</p>'></component>
                            <component src="list.html">
                                <component src="listitem.html" text='Participate in our virtual and on-site events such as <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Global-Accessibility-Awareness-Day-(GAAD).aspx" style="text-decoration:underline" class="underline text-blue-bg-link" style="text-decoration:underline" vlink="#C48EF3"><strong style="font-weight:normal">Global Accessibility Awareness Day (GAAD)<strong></a>'></component>
                                <component src="listitem.html" text='Reference our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Trainings-and-Events.aspx" style="text-decoration:underline" class="underline text-blue-bg-link" style="text-decoration:underline"><strong style="font-weight:normal">training materials<strong></a>'></component>
                                <component src="listitem.html" text="Attend accessibility conferences such as California State University, Northridge (CSUN) and axe-con"></component>
                                <component src="listitem.html" text='Learn about <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Virtual-Meetings.aspx" style="text-decoration:underline" class="underline text-blue-bg-link" style="text-decoration:underline"><strong style="font-weight:normal">inclusive meetings<strong></a> and how to provide <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Word-Documents.aspx" style="text-decoration:underline" class="underline text-blue-bg-link"><strong style="font-weight:normal">accessible Microsoft Word<strong></a> and <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-PowerPoints.aspx" style="text-decoration:underline" class="underline text-blue-bg-link"><strong style="font-weight:normal">Microsoft Powerpoint documents<strong></a>'></component>
                                <component src="listitem.html" text='Join our <a href="https://hiltonreservations.co1.qualtrics.com/jfe3/preview/previewId/00e271b1-1e96-4b48-81f0-e2e2b59d7321/SV_aeBiE3e4RBpOWAC?Q_CHL=preview&Q_SurveyVersionID=current" style="text-decoration:underline" class="underline text-blue-bg-link"><strong style="font-weight:normal">inclusive research panel<strong></a>'></component>
                            </component>
                            <component src="p.html" text='Connect with us on our <a href="https://teams.microsoft.com/l/team/19%3ApYhRabqQHbFslbAjjZIz68Z_puPeLQddP2sDXCZrN5Q1%40thread.tacv2/conversations?groupId=24efbafd-5565-49cc-81ed-a381a71936d8&tenantId=660292d2-cfd5-4a3d-b7a7-e8f7ee458a0a" style="text-decoration:underline" class="underline text-blue-bg-link"><strong style="font-weight:normal">Hospitable Hilton Teams Channel<strong></a> to get the answers to your accessibility questions. Let’s learn and grow together to enhance the experiences for everyone.'></component>
                        </component>
                        <component src="h2-background.html" text="News" color="beige-bg" textcolor="black" align="left"></component>
                        <component src="two-column.html" 
                        image1="../images/alt-text-short.png"
                        heading1="Contest Time!: Show us the power of alt text (and win a prize)"
                        alt1="A dog sitting on a suitcase with other luggage coming out of the back of a van"
                        text1='If a picture is worth a thousand words, alternative (alt) text read by screen readers are the voice for them.<p>But how do we sum up an image in only a few words?</p><p>Consider the context. Does the image add information to the surrounding text or is it more of a decoration? Is it illustrative of a feeling or emotion? Sometimes, alt text is generated automatically by AI; does that alt text accurately describe the image in context of the subject of the page?</p><h3>How to write alt text</h3><p>So how do you write good alt text? Tailor it accordingly. Be descriptive, not literal. Avoid bland descriptions and opt for descriptive yet concise text. Alt text can also be used to enhance SEO. Learn more in our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/Shared Documents/GAAD 2024/GAAD Recordings and Presentations/alt-text_why-it-matters-and-how-to-write-it-effectively.mp4" style="text-decoration:underline" class="underline text-beige-bg-link">GAAD 2024 presentation on alt text.</a></p><h3>Contest</h3><p>Now for our contest. Imagine the photo in this article is being used to advertise our pet-friendly hotels. What would you write for the alt text? Get creative and <a href="https://engage.cloud.microsoft/main/org/hilton.com/threads/eyJfdHlwZSI6IlRocmVhZCIsImlkIjoiMjk0OTM3NTEyODczOTg0MCJ9?trk_copy_link=V2" style="text-decoration:underline" class="underline text-beige-bg-link">add your alt text entry</a> to our Viva Engage post and you could win a Starbucks gift card!</p>'
                        image2="../images/csun-presentation-square-short.png"
                        alt2="Adam, Zane and Nicole at the CSUN 2024 presentation"
                        heading2="Hilton shows up to CSUN in full force"
                        text2='Close to 40 Hilton team members attended the CSUN assistive technology conference in Anaheim, California, from March 18–22, 2024. For Hilton team members, attending CSUN is an informative and immersive learning experience that underscores Hilton’s commitment to accessibility and inclusivity.<h3>Team member impact</h3> <p>“Meeting in person with the leading experts in assistive technology was an invaluable experience, and I left with an even deeper appreciation for the accessibility advocates we work with here at Hilton.” </p><p>- Regan Rusnak, Senior Manager, Product</p><h3>Highlights</h3><p>Zane McHattie, Adam Page, and Nicole Bergstrom presented ‘Beyond Silos: Hilton’s Cross-Functional Accessibility Model.’ This session attracted over 50 attendees, showcasing Hilton’s innovative approach to accessibility.</p><p>Also, during the conference, Hilton celebrated World Down Syndrome Day on March 21 with the ‘Lots of Socks’ campaign, emphasizing the uniqueness of Down syndrome and inviting hotel guests to design a sock for the day.</p><p>Check out our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/CSUN-Gallery.aspx" style="text-decoration:underline" class="underline text-beige-bg-link">CSUN image gallery</a>.We’re excited to invite you to next year’s conference. Look out for more news in early 2025 and be sure to chat with your manager about joining us or drop us a note at our inbox, <a href="mailto:digital.accessibility@hilton.com" class="underline text-beige-bg-link" style="text-decoration:underline">digital.accessbility@hilton.com</a>.</p>'
                        >
                        </component>
                        <component src="two-column.html"
                        image1="../images/paraolympics-short.png"
                        alt1="Howie Sanborn races the 1500 meter wheelchair race at the 2017 Warrior Games in Chicago, Ill., July 2, 2017"
                        heading1="Inclusive Fitness: Supporting athletes with disabilities in hotel gyms"
                        text1='Following the epic Paralympic Games in Paris, August 28–September 8, 2024, Hilton Hotels & Resorts continues to lead in promoting inclusive travel. They ensure fitness centers are accessible and supportive for athletes with disabilities. This initiative aligns with Hilton’s commitment to diversity and inclusion, creating a welcoming environment for all guests.<h3>Athelete Panel Discussion</h3><p>Two Team USA Paralympians joined us for a panel discussion at this year’s GAAD. They shared insights into the need for inclusive travel experiences for athletes with disabilities, especially hotel gym workouts. Several athletes shared their stories, and attendees learned steps that hotels can take to enhance gym accessibility.</p><p>Watch the GAAD session, "<a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/GAAD-2024-Virtual-Sessions.aspx#inclusive-fitness-supporting-athletes-with-disabilities-in-hotel-gyms" style="text-decoration:underline" class="underline text-beige-bg-link">Inclusive Fitness: Supporting Athletes with Disabilities in Hotel Gyms</a>" to learn more about accessibility in the hospitality industry.</p>'
                        image2="../images/accessible_video_player-short.png"
                        alt2="The accessible video player toolbar on the Graduate homepage"
                        heading2="A victory lap for digital accessibility: Unveiling the accessible video player"
                        text2='The Digital Accessibility team partnered with the One Hero Web (OHW) Brand team to create an accessible video player. The video player will help extend Hilton’s digital audience by delivering new content:<ul><li>Descriptive transcripts provide a text version of the video for guests with deaf-blindness and cognitive disabilities.</li><li>•	Closed captions describe the video’s audio content via togglable text for people who are deaf or hard of hearing.</li><li>•	Audio descriptions narrate the visual content for guests who may be blind or have low vision.</li></ul><h3>Customer impact</h3><p>Kris Murner, a content designer outside Hilton, says, “Wow! This is truly amazing and we need it in the education space, like, last week.” She eagerly awaits the player’s coding becoming open source to share with her clients. Her 20-year-old son, who has Stargardt disease and is legally blind, said, “Wait, they made audio descriptions a toggleable feature? That’s so cool.”<p>Special thanks to Ken Blasko, Adam Page, Regan Rusnak, Amy Huff, and other members of the OHW Brand team for supporting the work. So far, five videos have launched using the new player: four tutorials for <a href="https://www.hilton.com/en/p/hilton-for-business/tutorials/" style="text-decoration:underline" class="underline text-beige-bg-link">Hilton for Business</a> and one brand homepage video for <a href="https://www.hilton.com/en/brands/graduate-hotels/" style="text-decoration:underline" class="underline text-beige-bg-link">Graduate by Hilton</a> Big shout out to our Brand Marketing partners for embracing the new Hilton video player. Stay updated with the latest in Hilton Digital Accessibility as we continue our journey to make it right and accessible.</p><h3>Check out:</h3><p><ul><li><a href="https://www.hilton.com/en/brands/graduate-hotels/" class="underline text-beige-bg-link" style="text-decoration:underline">The video player in action</a> on Graduate by Hilton’s homepage</li><li>The <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/Shared%20Documents/GAAD%202023/2023%20videos/Creating%20an%20Accessible%20Video%20Experience-20230516_120310-Meeting%20Recording.mp4" class="underline text-beige-bg-link" style="text-decoration:underline">GAAD 2024 video on accessible video</a></li></ul></p>'
                        ></component>
