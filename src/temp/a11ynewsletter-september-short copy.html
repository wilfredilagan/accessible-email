                        <component src="h2-top.html" text="Unlocking accessibility access"></component>
                        <component src="feature.html" 
                            image="../images/unlock_accessibilty.png"
                            alt="A diverse image of people">
                            <component src="p.html" text='<p class="text-2sm font-main leading-4.5 m-0">Welcome to Unlocking Accessibility, a newsletter provided to you by the Accessibility Center of Excellence. We’re here to raise awareness about accessibility by celebrating the excellent work taking place at Hilton to make our digital channels and travel inclusive for our guests and team members with disabilities.</p><h3 class="font-main mt-2.5 mb-2.5">Disability stats</h3><p class="text-2sm font-main leading-4.5 m-0">Did you know the number of people worldwide who have a significant disability is roughly 1.3 billion? That is almost the entire population of China! People with Disabilities (PwD) often travel with companions, so when you include the friends, family, employers, and caregivers of PwD, it adds 2 billion more people with an estimated total spending power of $16 trillion. The need for accessibility can’t be underestimated.</p><h3 class="font-main mt-2.5 mb-2.5">How you can contribute</h3><p class="text-2sm font-main leading-4.5 m-0">Get involved in Hilton’s best-in-class accessible travel experiences and increase your accessibility knowledge:</p>'></component>
                            <component src="list.html">
                                <component src="listitem.html" text='Participate in our virtual and on-site events such as <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Global-Accessibility-Awareness-Day-(GAAD).aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline" vlink="#C48EF3"><strong style="font-weight:normal">Global Accessibility Awareness Day (GAAD)<strong></a>'></component>
                                <component src="listitem.html" text='Reference our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Trainings-and-Events.aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline"><strong style="font-weight:normal">training materials<strong></a>'></component>
                                <component src="listitem.html" text="Attend accessibility conferences such as California State University, Northridge (CSUN) and axe-con"></component>
                                <component src="listitem.html" text='Learn about <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Virtual-Meetings.aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline"><strong style="font-weight:normal">inclusive meetings<strong></a> and how to provide <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Word-Documents.aspx" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">accessible Microsoft Word<strong></a> and <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-PowerPoints.aspx" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">Microsoft Powerpoint documents<strong></a>'></component>
                            </component>
                            <component src="p.html" text='<p class="text-2sm font-main leading-4.5 m-0">Connect with us on our <a href="https://teams.microsoft.com/l/team/19%3ApYhRabqQHbFslbAjjZIz68Z_puPeLQddP2sDXCZrN5Q1%40thread.tacv2/conversations?groupId=24efbafd-5565-49cc-81ed-a381a71936d8&tenantId=660292d2-cfd5-4a3d-b7a7-e8f7ee458a0a" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">Accessibility Central Teams Channel<strong></a> to get the answers to your accessibility questions. Let’s learn and grow together to enhance the experiences for everyone.</p>'></component>
                        </component>
                        <component src="h2-background.html" text="A victory lap for digital accessibility: Unveiling the accessible video player" color="lightblue-bg" textcolor="black" align="left"></component>
                        <component src="feature.html"
                            image="../images/accessible-video-player-full.png"
                            alt="The accessible video player toolbar on the Graduate homepage">
                            <component src="p.html" text='<p class="text-2sm font-main leading-4.5 m-0" >Hilton’s Digital Accessibility team joined forces with the One Hero Web (OHW) Brand team to create a very cool accessible video player! This player is set to expand Hilton’s digital reach with awesome new content:<ul><li><p class="text-2sm font-main leading-4.5" style="margin-top: 10px; margin-bottom:0"><b>Descriptive transcripts:</b> Text versions for guests with deaf-blindness and cognitive disabilities.</p></li><li><p class="text-2sm font-main leading-4.5 m-0"><b>Closed captions:</b> Toggleable text for those who are deaf or hard of hearing.</p></li><li><p class="text-2sm font-main leading-4.5 m-0"><b>Audio descriptions:</b> Narrations for guests who are blind or have low vision.</p></li></ul></p><h3 class="mt-2.5 mb-2.5">Customer impact</h3><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">Kris Murner, a content designer outside Hilton, says, “Wow! This is truly amazing and we need it in the education space, like, last week.” She eagerly awaits the player’s coding becoming open source to share with her clients. Her 20-year-old son, who has Stargardt disease and is legally blind, said, “Wait, they made audio descriptions a toggleable feature? That’s so cool.”</p><p class="text-2sm font-main leading-4.5 m-0">Huge thanks to Ken Blasko, Adam Page, Regan Rusnak, Amy Huff, and the OHW Brand team. So far, five videos are live: four tutorials for <a href="https://www.hilton.com/en/p/hilton-for-business/tutorials/" style="text-decoration:underline" class="underline text-beige-bg-link">Hilton for Business</a> and one brand video for <a href="https://www.hilton.com/en/brands/graduate-hotels/" style="text-decoration:underline" class="underline text-beige-bg-link">Graduate by Hilton.</a> Big shout out to our Brand Marketing partners for embracing the new Hilton video player. Stay updated with the latest in Hilton Digital Accessibility as we continue our journey to make it right and accessible.</p><h3>Check out:</h3><ul><li><p class="text-2sm font-main leading-4.5 m-0"><a href="https://www.hilton.com/en/brands/graduate-hotels/" class="underline text-beige-bg-link" style="text-decoration:underline">The video player in action</a> on Graduate by Hilton’s homepage</p></li><li><p class="text-2sm font-main leading-4.5 m-0">The <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/Shared%20Documents/GAAD%202023/2023%20videos/Creating%20an%20Accessible%20Video%20Experience-20230516_120310-Meeting%20Recording.mp4" class="underline text-beige-bg-link" style="text-decoration:underline">GAAD 2024 video on accessible video</a></p></li></ul>'></component>
                        </component>
                        <component src="h2-background.html" text="Features" color="beige-bg" textcolor="black" align="left"></component>
                        <component src="two-column.html" 
                        image1="../images/alt-text-short.png"
                        heading1="Contest time!: Show us the power of alt text (and win a prize)"
                        alt1="Back end of a van open with backpacks, suitcases, and a soccer ball. On the ground is a suitcase with a French bulldog sitting on it."
                        text1='<p style="margin-bottom:10px; margin-top:0px">If a picture is worth a thousand words, alternative (alt) text read by screen readers are the voice for them.</p><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">But how do we sum up an image in only a few words?</p><p class="text-2sm font-main leading-4.5 m-0">Consider the context. Does the image add information or is it decorative? Does it illustrate a feeling or emotion? Sometimes, AI generates alt text; does it accurately describe the image in the page’s context?</p><h3 class="mt-2.5 mb-2.5">How to write alt text</h3><p class="text-2sm font-main leading-4.5 m-0">Be descriptive, not literal. Avoid bland descriptions and aim for concise, vivid text. Alt text can also boost SEO. Learn more in our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/Shared Documents/GAAD 2024/GAAD Recordings and Presentations/alt-text_why-it-matters-and-how-to-write-it-effectively.mp4" style="text-decoration:underline" class="underline text-beige-bg-link">GAAD 2024 presentation on alt text.</a></p><h3 class="mt-2.5 mb-2.5">Contest</h3><p class="text-2sm font-main leading-4.5 m-0">Imagine the photo in this article advertises our pet-friendly hotels. What would you write for the alt text? <a href="https://engage.cloud.microsoft/main/org/hilton.com/threads/eyJfdHlwZSI6IlRocmVhZCIsImlkIjoiMjk0OTM3NTEyODczOTg0MCJ9?trk_copy_link=V2" style="text-decoration:underline" class="underline text-beige-bg-link">Share your alt text entry</a> to our Viva Engage post and you could win a Starbucks gift card!</p>'
                        image2="../images/paraolympics-short.png"
                        alt2="Howie Sanborn races the 1500 meter wheelchair race at the 2017 Warrior Games in Chicago, Ill., July 2, 2017"
                        heading2="Inclusive fitness: Supporting athletes with disabilities in hotel gyms"
                        text2='<p class="text-2sm font-main leading-4.5 m-0">Following the epic Paralympic Games in Paris, August 28–September 8, 2024, Hilton Hotels & Resorts continues to lead in promoting inclusive travel. They ensure fitness centers are accessible and supportive for athletes with disabilities. This initiative aligns with Hilton’s commitment to diversity and inclusion, creating a welcoming environment for all guests.</p><h3 class="mt-2.5 mb-2.5">Athlete panel discussion</h3><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">Two Team USA Paralympians joined us for a panel discussion at this year’s GAAD. They shared insights into the need for inclusive travel experiences for athletes with disabilities, especially hotel gym workouts. Several athletes shared their stories, and attendees learned steps that hotels can take to enhance gym accessibility.</p><p class="text-2sm font-main leading-4.5 m-0">Watch the GAAD session "<a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/GAAD-2024-Virtual-Sessions.aspx#inclusive-fitness-supporting-athletes-with-disabilities-in-hotel-gyms" style="text-decoration:underline" class="underline text-beige-bg-link">Inclusive Fitness: Supporting Athletes with Disabilities in Hotel Gyms</a>" to learn more about accessibility in the hospitality industry.</p>'>
                        </component>
