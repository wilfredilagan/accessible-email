                        <component src="h2-top.html" text="Unlocking accessibility access"></component>
                        <component src="feature.html" 
                            image="../images/unlock_accessibilty.png"
                            alt="A diverse image of people">
                            <component src="p.html" text='<p class="text-2sm font-main leading-4.5 m-0">Welcome to the Unlocking Accessibility newsletter, provided to you by the Accessibility Center of Excellence. We’re here to raise awareness about accessibility by celebrating the excellent work taking place at Hilton to make travel inclusive for our guests and team members with and without disabilities.</p><h3 class="font-main mt-2.5 mb-2.5">Disability stats</h3><p class="text-2sm font-main leading-4.5 m-0">Did you know the number of people worldwide who have a significant disability is roughly 1.3 billion? That is almost the entire population of China! People with Disabilities (PwD) often travel with companions, so when you include the friends, family, employers, and caregivers of PwD, it adds 2 billion more people with an estimated total spending power of $16 trillion. The need for accessibility can’t be underestimated.</p><h3 class="font-main mt-2.5 mb-2.5">How you can contribute</h3><p class="text-2sm font-main leading-4.5 m-0">Get involved in Hilton’s best-in-class accessible travel experiences and increase your accessibility knowledge:</p>'></component>
                            <component src="list.html">
                                <component src="listitem.html" text='Participate in our virtual and on-site events such as <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Global-Accessibility-Awareness-Day-(GAAD).aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline" vlink="#C48EF3"><strong style="font-weight:normal">Global Accessibility Awareness Day (GAAD)<strong></a>'></component>
                                <component src="listitem.html" text='Reference our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Trainings-and-Events.aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline"><strong style="font-weight:normal">training materials<strong></a>'></component>
                                <component src="listitem.html" text="Attend accessibility conferences such as California State University, Northridge (CSUN) and axe-con"></component>
                                <component src="listitem.html" text='Learn about <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Virtual-Meetings.aspx" style="text-decoration:underline" class="underline " style="text-decoration:underline"><strong style="font-weight:normal">inclusive meetings<strong></a> and how to provide <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-Word-Documents.aspx" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">accessible Microsoft Word<strong></a> and <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/Accessible-PowerPoints.aspx" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">Microsoft Powerpoint documents<strong></a>'></component>
                                <component src="listitem.html" text='Join our <a href="https://hiltonreservations.co1.qualtrics.com/jfe3/preview/previewId/00e271b1-1e96-4b48-81f0-e2e2b59d7321/SV_aeBiE3e4RBpOWAC?Q_CHL=preview&Q_SurveyVersionID=current" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">inclusive research panel<strong></a>'></component>
                            </component>
                            <component src="p.html" text='<p class="text-2sm font-main leading-4.5 m-0">Connect with us on our <a href="https://teams.microsoft.com/l/team/19%3ApYhRabqQHbFslbAjjZIz68Z_puPeLQddP2sDXCZrN5Q1%40thread.tacv2/conversations?groupId=24efbafd-5565-49cc-81ed-a381a71936d8&tenantId=660292d2-cfd5-4a3d-b7a7-e8f7ee458a0a" style="text-decoration:underline" class="underline "><strong style="font-weight:normal">Accessibility Central Teams Channel<strong></a> to get the answers to your accessibility questions. Let’s learn and grow together to enhance the experiences for everyone.</p>'></component>
                        </component>
                        <component src="h2-background.html" text="Features" color="beige-bg" textcolor="black" align="left"></component>
                        <component src="two-column.html" 
                        image1="../images/alt-text-short.png"
                        heading1="Contest time!: Show us the power of alt text (and win a prize)"
                        alt1="Back end of a van open with backpacks, suitcases, and a soccer ball. On the ground is a suitcase with a French bulldog sitting on it. "
                        text1='<p style="margin-bottom:10px; margin-top:0px">If a picture is worth a thousand words, alternative (alt) text read by screen readers are the voice for them.</p><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">But how do we sum up an image in only a few words?</p><p class="text-2sm font-main leading-4.5 m-0">Consider the context. Does the image add information or is it decorative? Does it illustrate a feeling or emotion? Sometimes, AI generates alt text; does it accurately describe the image in the page’s context?</p><h3 class="mt-2.5 mb-2.5">How to write alt text</h3><p class="text-2sm font-main leading-4.5 m-0">Be descriptive, not literal. Avoid bland descriptions and aim for concise, vivid text. Alt text can also boost SEO. Learn more in our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/Shared Documents/GAAD 2024/GAAD Recordings and Presentations/alt-text_why-it-matters-and-how-to-write-it-effectively.mp4" style="text-decoration:underline" class="underline text-beige-bg-link">GAAD 2024 presentation on alt text.</a></p><h3 class="mt-2.5 mb-2.5">Contest</h3><p class="text-2sm font-main leading-4.5 m-0">Imagine the photo in this article advertises our pet-friendly hotels. What would you write for the alt text? <a href="https://engage.cloud.microsoft/main/org/hilton.com/threads/eyJfdHlwZSI6IlRocmVhZCIsImlkIjoiMjk0OTM3NTEyODczOTg0MCJ9?trk_copy_link=V2" style="text-decoration:underline" class="underline text-beige-bg-link">Share your alt text entry</a> to our Viva Engage post and you could win a Starbucks gift card!</p>'
                        image2="../images/csun-presentation-square-short.png"
                        alt2="Adam, Zane and Nicole at the CSUN 2024 presentation"
                        heading2="Hilton shows up to CSUN in full force"
                        text2='<p class="text-2sm font-main leading-4.5 m-0">Hilton rocked the CSUN assistive technology conference in Anaheim, California, from March 18–22, 2024, with nearly 40 team members in tow! This event was a treasure trove of knowledge, highlighting Hilton’s dedication to accessibility and inclusivity.</p><h3 class="mt-2.5 mb-2.5">Team member impact</h3> <p class="text-2sm font-main leading-4.5 m-0">“Meeting in person with the leading experts in assistive technology was an invaluable experience, and I left with an even deeper appreciation for the accessibility advocates we work with here at Hilton.” </p><p class="text-2sm font-main leading-4.5 m-0">- Regan Rusnak, Senior Manager, Product</p><h3 class="mt-2.5 mb-2.5">Highlights</h3><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">Zane McHattie, Adam Page, and Nicole Bergstrom dazzled over 50 attendees with their presentation, ‘Beyond Silos: Hilton’s Cross-Functional Accessibility Model,’ and on March 21, Hilton celebrated World Down Syndrome Day with the ‘Lots of Socks’ campaign, inviting guests to design unique socks, celebrating the beauty of diversity.</p><p class="text-2sm font-main leading-4.5 m-0">Check out our <a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/CSUN-Gallery.aspx" style="text-decoration:underline" class="underline text-beige-bg-link">CSUN image gallery</a> and get ready for next year’s conference! Stay tuned for more updates in early 2025. Chat with your manager or drop us a note at our inbox, <a href="mailto:digital.accessibility@hilton.com" class="underline text-beige-bg-link" style="text-decoration:underline">digital.accessibility@hilton.com</a>.</p>'
                        >
                        </component>
                        <component src="two-column.html"
                        image1="../images/paraolympics-short.png"
                        alt1="Howie Sanborn races the 1500 meter wheelchair race at the 2017 Warrior Games in Chicago, Ill., July 2, 2017"
                        heading1="Inclusive fitness: Supporting athletes with disabilities in hotel gyms"
                        text1='<p class="text-2sm font-main leading-4.5 m-0">Following the epic Paralympic Games in Paris, August 28–September 8, 2024, Hilton Hotels & Resorts continues to lead in promoting inclusive travel. They ensure fitness centers are accessible and supportive for athletes with disabilities. This initiative aligns with Hilton’s commitment to diversity and inclusion, creating a welcoming environment for all guests.</p><h3 class="mt-2.5 mb-2.5">Athlete panel discussion</h3><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">Two Team USA Paralympians joined us for a panel discussion at this year’s GAAD. They shared insights into the need for inclusive travel experiences for athletes with disabilities, especially hotel gym workouts. Several athletes shared their stories, and attendees learned steps that hotels can take to enhance gym accessibility.</p><p class="text-2sm font-main leading-4.5 m-0">Watch the GAAD session "<a href="https://hilton.sharepoint.com/sites/LS_Accessibility/SitePages/GAAD-2024-Virtual-Sessions.aspx#inclusive-fitness-supporting-athletes-with-disabilities-in-hotel-gyms" style="text-decoration:underline" class="underline text-beige-bg-link">Inclusive Fitness: Supporting Athletes with Disabilities in Hotel Gyms</a>" to learn more about accessibility in the hospitality industry.</p>'
                        image2="../images/accessible_video_player-short.png"
                        alt2="The accessible video player toolbar on the Graduate homepage"
                        heading2="A victory lap for digital accessibility: Unveiling the accessible video player"
                        text2='<p class="text-2sm font-main leading-4.5 m-0" >Hilton’s Digital Accessibility team joined forces with the One Hero Web (OHW) Brand team to create a very cool accessible video player! This player is set to expand Hilton’s digital reach with awesome new content:<ul><li><p <p class="text-2sm font-main leading-4.5" style="margin-top: 10px; margin-bottom:0"><b>Descriptive transcripts:</b> Text versions for guests with deaf-blindness and cognitive disabilities.</p></li><li><p <p class="text-2sm font-main leading-4.5 m-0"><b>Closed captions:</b> Toggleable text for those who are deaf or hard of hearing.</p></li><li><p <p class="text-2sm font-main leading-4.5 m-0"><b>Audio descriptions:</b> Narrations for guests who are blind or have low vision.</p></li></ul></p><h3 class="mt-2.5 mb-2.5">Customer impact</h3><p class="text-2sm font-main leading-4.5" style="margin-bottom:10px; margin-top:0px">Kris Murner, a content designer outside Hilton, says, “Wow! This is truly amazing and we need it in the education space, like, last week.” Her 20-year-old son, who has Stargardt disease and is legally blind, said, “Wait, they made audio descriptions a toggleable feature? That’s so cool.”</p><p class="text-2sm font-main leading-4.5 m-0">Huge thanks to Ken Blasko, Adam Page, Regan Rusnak, Amy Huff, and the OHW Brand team. So far, five videos are live: four tutorials for <a href="https://www.hilton.com/en/p/hilton-for-business/tutorials/" style="text-decoration:underline" class="underline text-beige-bg-link">Hilton for Business</a> and one brand video for <a href="https://www.hilton.com/en/brands/graduate-hotels/" style="text-decoration:underline" class="underline text-beige-bg-link">Graduate by Hilton.</a></p>'
                        ></component>
